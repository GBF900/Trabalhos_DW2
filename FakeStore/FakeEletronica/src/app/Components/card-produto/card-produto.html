<div class="card">

    <div class="card-image">

        <img
        [src]="produto.image"
        [alt]="produto.title">

    </div>

    <div class="card-content">

        <h3 class="card-title">

            {{produto.title}}

        </h3>

        <p class="card-price">

        {{produto.price * 5 | currency: 'BRL': 'symbol':'1.2-2'}}

        </p>

        <button
        class="btn-success"
        (click)="abrirProduto()">

            Ver Produto

        </button>

    </div>

</div>
