<div class="container-fluid">

<div class="card shadow">

<div class="card-header">

<h3>

@if(modoEdicao){

Editar Produto

}

@else{

Novo Produto

}

</h3>

</div>

<div class="card-body">

<form

[formGroup]="formulario"

(ngSubmit)="salvar()">

<div class="mb-3">

<label>

Nome

</label>

<input

class="form-control"

formControlName="title">

</div>

<div class="row">

<div class="col-md-6">

<label>

Preço

</label>

<input

type="number"

class="form-control"

formControlName="price">

</div>

<div class="col-md-6">

<label>

Categoria

</label>

<select

class="form-select"

formControlName="category">

<option

*ngFor="let categoria of categorias"

[value]="categoria.id">

{{categoria.name}}

</option>

</select>

</div>

</div>

<div class="mt-3">

<label>

Imagem

</label>

<input

class="form-control"

formControlName="image">

</div>

<div class="mt-3">

<label>

Descrição

</label>

<textarea

rows="5"

class="form-control"

formControlName="description">

</textarea>

</div>

<div class="mt-4">

<button

class="btn btn-success me-2">

Salvar

</button>

<button

type="button"

class="btn btn-secondary"

(click)="cancelar()">

Cancelar

</button>

</div>

</form>

</div>

</div>

</div>
