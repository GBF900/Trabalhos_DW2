<div class="container-fluid tela-login">

    <div class="row justify-content-center align-items-center vh-100">

        <div class="col-11 col-sm-9 col-md-7 col-lg-5 col-xl-4">

            <div class="card shadow-lg">

                <div class="card-body p-5">

                    <div class="text-center mb-4">

                        <i class="bi bi-bag-fill fs-1 text-primary"></i>

                        <h2 class="mt-3">
                            Fake Store
                        </h2>

                        <p class="text-secondary">
                            Faça login para continuar
                        </p>

                    </div>

                    @if(erro){
                        <div class="alert alert-danger">
                            {{erro}}
                        </div>
                    }

                    <form [formGroup]="formulario"
                          (ngSubmit)="login()">

                        <div class="mb-3">

                            <label class="form-label">
                                Email
                            </label>

                            <input
                                class="form-control"
                                type="email"
                                formControlName="email">

                        </div>

                        <div class="campo-senha mb-4">

                            <label class="form-label">
                                Senha
                            </label>

                            <input
                                class="form-control"
                                [type]="mostrarSenha ? 'text': 'password' "
                                formControlName="password"
                                >
                            <button type="button" (click)="mostrarSenhaClick()"><i [ngClass]="mostrarSenha ? 'bi bi-eye-slash' : 'bi bi-eye' "></i></button>
                        </div>

                        <button
                            class="btn btn-primary w-100"
                            [disabled]="formulario.invalid || carregando">

                            Entrar

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>
