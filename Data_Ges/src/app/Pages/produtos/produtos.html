<div class="container-fluid">

    <div class="card shadow">

        <div class="card-header">

            <div class="d-flex justify-content-between align-items-center">

                <h3>

                    <i class="bi bi-box-seam"></i>

                    Produtos

                </h3>

                <a
                    routerLink="/produtos/novo"
                    class="btn btn-primary">

                    <i class="bi bi-plus-circle"></i>

                    Novo Produto

                </a>

            </div>

        </div>

        <div class="card-body">

            <div class="row g-3">

                <div class="col-md-4">

                    <label>

                        Nome

                    </label>

                    <input
                        class="form-control"
                        [(ngModel)]="textoPesquisa">

                </div>

                <div class="col-md-3">

                    <label>

                        Categoria

                    </label>

                    <select
                        class="form-select"
                        [(ngModel)]="categoriaSelecionada">

                        <option value="">

                            Todas

                        </option>

                        <option
                            *ngFor="let categoria of categorias"
                            [value]="categoria.id">

                            {{categoria.name}}

                        </option>

                    </select>

                </div>

                <div class="col-md-2">

                    <label>

                        Preço Mín.

                    </label>

                    <input
                        type="number"
                        class="form-control"
                        [(ngModel)]="precoMinimo">

                </div>

                <div class="col-md-2">

                    <label>

                        Preço Máx.

                    </label>

                    <input
                        type="number"
                        class="form-control"
                        [(ngModel)]="precoMaximo">

                </div>

                <div class="col-md-1 d-grid">

                    <label>&nbsp;</label>

                    <button
                        class="btn btn-success"
                        (click)="buscarProdutos()">

                        <i class="bi bi-search"></i>

                    </button>

                </div>

            </div>

            <div class="mt-3">

                <button
                    class="btn btn-outline-secondary"
                    (click)="limparFiltros()">

                    Limpar filtros

                </button>

            </div>

            <hr>

        @if(erro){
            <div class="alert alert-danger">
                {{erro}}
            </div>
        }

        @if(carregando){
        
            <div class="text-center p-5">
                <div class="spinner-border text-primary"></div>

            </div>
        }

        @else{
        <table class="table table-hover align-middle">
            <thead class="table-primary">
                <tr>
                    <th>ID</th>

                    <th>Imagem</th>

                    <th>Produto</th>

                    <th>Categoria</th>

                    <th>Preço</th>

                    <th></th>

                </tr>

                </thead>

                <tbody>

            @for(produto of produtos; track produto.id){        
                <tr>
                    <td>
                        {{produto.id}}

                    </td>

                    <td>

                    <img [src]="produto.images[0]" loading="lazy" class="foto">

                    </td>
                    <td>

                        {{produto.title}}

                    </td>

                    <td>

                        {{produto.category.name}}

                    </td>

                    <td>

                        {{produto.price | currency:'BRL'}}

                    </td>

                    <td>

                        <button
                            class="btn btn-warning btn-sm me-2"
                            (click)="editar(produto)">

                            <i class="bi bi-pencil"></i>

                        </button>

                        <button
                            class="btn btn-danger btn-sm"
                            (click)="excluir(produto)">

                            <i class="bi bi-trash"></i>

                        </button>

                    </td>

                </tr>
            }
                </tbody>

            </table>

            @if(temMaisProdutos){
                <div class="text-center">
                    <button
                        class="btn btn-outline-primary"
                        [disabled]="carregandoMais"
                        (click)="carregarMais()">

                        {{ carregandoMais ? 'Carregando...' : 'Carregar mais' }}

                    </button>
                </div>
            }
        }
        </div>

    </div>

</div>
